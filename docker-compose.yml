services:
  db:
    build:
      context: ./Database
      dockerfile: Dockerfile
    environment:
      - SA_PASSWORD=YourStrongPassword123
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrongPassword123 -C -Q 'SELECT 1 FROM sys.databases WHERE name = ''ChessDb'''"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - dbdata:/var/opt/mssql
    networks:
      - app-network

  backend:
    build:
      context: ./Backend/ChessBackend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ChessDb;User Id=chessuser;Password=YourStrongPassword123;TrustServerCertificate=True;
    # Remove ports unless you need direct access to backend for debugging
    ports:
      - "5000:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata: